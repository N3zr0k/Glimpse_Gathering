name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Struktur prüfen (TOC, XML, Dateien)
        run: python3 tools/check.py

      - name: luacheck
        uses: lunarmodules/luacheck@v1

      # Die Tests brauchen das Modul Locations aus dem Kern (Repo Glimpse)
      - name: Kern Glimpse holen
        uses: actions/checkout@v4
        with:
          repository: N3zr0k/Glimpse
          path: .glimpse

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"

      - name: Tests
        env:
          GLIMPSE_DIR: .glimpse
        run: lua tests/run.lua

  # Neue Version in der TOC und alles grün -> Tag setzen und Release bauen.
  # Steht im CHANGELOG nur [Unreleased], wird eine Vorabversion (vX.Y.Z-beta.1) gebaut.
  # Nur auf main; Pull Requests und bereits getaggte Versionen werden übersprungen.
  tag:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag anlegen, wenn die TOC-Version neu ist
        run: |
          version="$(python3 tools/check.py --version)"
          final="v$version"
          if git rev-parse -q --verify "refs/tags/$final" > /dev/null; then
            echo "Tag $final existiert schon, nichts zu tun."
            exit 0
          fi
          if grep -Eq "^##[[:space:]]*\[?$(printf '%s' "$version" | sed 's/\./\\./g')\]?" CHANGELOG.md; then
            tag="$final"                      # CHANGELOG-Abschnitt vorhanden: richtiges Release
          elif grep -Eiq '^##[[:space:]]*\[?Unreleased\]?' CHANGELOG.md; then
            if [ -n "$(git tag -l "$final-beta.*")" ]; then
              echo "Für $version gibt es schon eine Vorabversion, nichts zu tun."
              exit 0
            fi
            tag="$final-beta.1"               # nur Unreleased: Vorabversion
          else
            tag="$final"                      # check.py meldet den fehlenden Abschnitt
          fi
          # TOC-Versionen und CHANGELOG müssen zum Tag passen, sonst gibt es kein Tag
          python3 tools/check.py --tag "$tag"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          # Ein mit dem GITHUB_TOKEN gepushtes Tag startet keinen Push-Workflow. Der Release-Workflow
          # wird deshalb ausdrücklich auf dem Tag gestartet (dispatch ist für das Token erlaubt).
          gh workflow run release.yml --ref "$tag"
          echo "Release-Workflow für $tag gestartet."
