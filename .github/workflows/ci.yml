name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Struktur prüfen (TOC, XML, Dateien)
        run: python3 tools/check.py

      - name: luacheck
        uses: lunarmodules/luacheck@v1

      # Die Tests brauchen das Modul Locations aus dem Kern (Repo Glimpse)
      - name: Kern Glimpse holen
        uses: actions/checkout@v4
        with:
          repository: N3zr0k/Glimpse
          path: .glimpse

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"

      - name: Tests
        env:
          GLIMPSE_DIR: .glimpse
        run: lua tests/run.lua

  # Neue Version oder neue Stufe und alles grün -> Tag setzen und Release bauen. Die Stufe steht im CHANGELOG:
  #   nur "## [Unreleased]"                 Alpha   vX.Y.Z-alpha.1  (Vorabversion)
  #   "## [X.Y.Z] - Datum (beta)"           Beta    vX.Y.Z-beta.1   (richtiges Release, als Vorabversion veröffentlicht)
  #   "## [X.Y.Z] - Datum"                  final   vX.Y.Z
  # Nur auf main; Pull Requests und Stufen, die es für die Version schon gibt (oder höhere), werden übersprungen.
  tag:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.make.outputs.tag }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag anlegen, wenn die Version oder ihre Stufe neu ist
        id: make
        run: |
          # Die Stufe steht im CHANGELOG (siehe tools/check.py): Alpha, Beta oder final.
          tag="$(python3 tools/check.py --next-tag)"
          if [ -z "$tag" ]; then
            # Gibt es das Tag schon, aber noch kein Release (z. B. ein früherer Lauf ist gescheitert), wird nur das
            # Release gebaut. Sonst ist nichts zu tun.
            current="$(python3 tools/check.py --current-tag)"
            if [ -n "$current" ] && ! gh release view "$current" > /dev/null 2>&1; then
              echo "Tag $current existiert, aber es gibt noch kein Release: es wird gebaut."
              echo "tag=$current" >> "$GITHUB_OUTPUT"
            else
              echo "Für diese Version gibt es schon ein Tag dieser oder einer höheren Stufe, nichts zu tun."
            fi
            exit 0
          fi
          # TOC-Versionen und CHANGELOG müssen zum Tag passen, sonst gibt es kein Tag
          python3 tools/check.py --tag "$tag"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Tag $tag angelegt, das Release wird im Job release gebaut."

  # Ein mit dem GITHUB_TOKEN gepushtes Tag startet keinen Push-Workflow. Das Release wird deshalb hier
  # gebaut: release.yml läuft als wiederverwendbarer Workflow und holt das Tag selbst aus dem Repo.
  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
